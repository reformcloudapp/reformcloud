name: Java CI

on:
  push:
    branches:
      - master
      - indev
  pull_request:
    branches:
      - master
      - indev

jobs:
  build:
    strategy:
      matrix:
        platform: [ ubuntu-latest, windows-latest ]

    runs-on: ${{ matrix.platform }}
    name: on ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '23'
      - name: Build with Maven
        run: mvn -V clean package --file pom.xml
